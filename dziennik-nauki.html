<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dziennik nauki</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" id="themeColorMeta" content="#F5F8F7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dziennik">
<script>
/* motyw ustawiany przed pierwszym malowaniem, żeby nie było mignięcia */
(function () {
  try {
    var t = localStorage.getItem('dziennik-nauki:theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ================= TOKENY: Modern Teal Signature ================= */
  :root{
    /* marka */
    --teal-deep:#087F75; --teal:#13B8A6; --teal-soft:#75DDD0; --teal-mist:#D9F3EF;
    /* semantyka */
    --success:#299D72; --warning:#E6A23C; --error:#D95C61; --info:#558FC5;

    /* motyw jasny (domyślny) */
    --bg:#F5F8F7; --surface:#FFFFFF; --elevated:#EAF1EF; --text:#192A30;
    --text-soft:#52666B; --text-faint:#81959A;
    --border:#D5E1DE; --border-soft:#E6EEEC;
    --accent:#087F75; --accent-strong:#06695F; --accent-fg:#FFFFFF;
    --accent-tint:#D9F3EF; --accent-text:#087F75;
    --ring-track:#E2ECE9; --tick:#9FD8D0;
    --grad-a:#087F75; --grad-b:#13B8A6;
    --shadow-sm:0 1px 2px rgba(16,42,48,.05),0 1px 1px rgba(16,42,48,.03);
    --shadow-md:0 10px 28px rgba(16,42,48,.10),0 2px 6px rgba(16,42,48,.05);
    --overlay:rgba(16,26,32,.36);

    /* kształty i odstępy */
    --r-sm:10px; --r-btn:12px; --r-card:16px; --r-lg:20px;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;

    /* ruch */
    --ease:cubic-bezier(.2,.7,.2,1); --dur:180ms;

    /* typografia */
    --font-head:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#101A20; --surface:#19262E; --elevated:#22333C; --text:#DCE8E9;
    --text-soft:#9FB3B7; --text-faint:#6D8388;
    --border:#2C414B; --border-soft:#22343D;
    --accent:#13B8A6; --accent-strong:#2FCAB8; --accent-fg:#06221F;
    --accent-tint:rgba(19,184,166,.14); --accent-text:#75DDD0;
    --ring-track:#263A44; --tick:#2C6762;
    --grad-a:#13B8A6; --grad-b:#75DDD0;
    --shadow-sm:0 1px 2px rgba(0,0,0,.25);
    --shadow-md:0 12px 32px rgba(0,0,0,.40),0 2px 6px rgba(0,0,0,.25);
    --overlay:rgba(5,10,13,.62);
    color-scheme:dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101A20; --surface:#19262E; --elevated:#22333C; --text:#DCE8E9;
      --text-soft:#9FB3B7; --text-faint:#6D8388;
      --border:#2C414B; --border-soft:#22343D;
      --accent:#13B8A6; --accent-strong:#2FCAB8; --accent-fg:#06221F;
      --accent-tint:rgba(19,184,166,.14); --accent-text:#75DDD0;
      --ring-track:#263A44; --tick:#2C6762;
      --grad-a:#13B8A6; --grad-b:#75DDD0;
      --shadow-sm:0 1px 2px rgba(0,0,0,.25);
      --shadow-md:0 12px 32px rgba(0,0,0,.40),0 2px 6px rgba(0,0,0,.25);
      --overlay:rgba(5,10,13,.62);
      color-scheme:dark;
    }
  }

  /* ================= PODSTAWY ================= */
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html.theme-anim *, html.theme-anim *::before{transition:background-color .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease)!important}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.5;min-height:100vh;display:flex;justify-content:center;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  .page{width:100%;max-width:600px;padding:max(var(--s5),env(safe-area-inset-top)) max(var(--s4),env(safe-area-inset-right)) calc(var(--s7) + env(safe-area-inset-bottom)) max(var(--s4),env(safe-area-inset-left))}
  .num{font-variant-numeric:tabular-nums}
  svg{display:block}

  /* ================= NAGŁÓWEK ================= */
  header.top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:var(--s2);margin-bottom:var(--s5)}
  .head-text{text-align:center;min-width:0}
  .date-line{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--text-soft)}
  .title{font-family:var(--font-head);font-size:clamp(24px,4vw + 10px,32px);font-weight:700;letter-spacing:-.02em;margin:2px 0 0;line-height:1.2}
  .title::after{content:'';display:block;width:28px;height:2px;border-radius:2px;margin:var(--s2) auto 0;background:linear-gradient(90deg,var(--grad-a),var(--grad-b))}

  /* ================= ZAKŁADKI ================= */
  nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s1);padding:var(--s1);margin-bottom:var(--s4);background:var(--elevated);border:1px solid var(--border-soft);border-radius:var(--r-btn)}
  nav.tabs button{font-family:var(--font-body);font-size:13px;font-weight:500;background:transparent;border:none;padding:10px 4px;min-height:40px;color:var(--text-soft);cursor:pointer;border-radius:calc(var(--r-btn) - 4px);transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);white-space:nowrap}
  nav.tabs button:hover{color:var(--text)}
  nav.tabs button.active{background:var(--surface);color:var(--accent-text);font-weight:600;box-shadow:var(--shadow-sm)}

  .view{display:none}
  .view.active{display:block;animation:viewIn .24s var(--ease)}
  @keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--r-card);padding:var(--s5) var(--s4);box-shadow:var(--shadow-sm)}
  @media (min-width:640px){.card{padding:var(--s6)}}

  /* ================= TARCZA TIMERA ================= */
  .dial-wrap{display:flex;justify-content:center;margin-bottom:var(--s5)}
  .dial{position:relative;width:216px;height:216px}
  @media (max-width:360px){.dial{width:196px;height:196px}}
  .dial svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
  .dial-track{fill:none;stroke:var(--ring-track);stroke-width:3}
  .dial-tick{stroke:var(--tick);stroke-width:2;stroke-linecap:round}
  .dial-progress{fill:none;stroke:url(#dialGrad);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
  .grad-a{stop-color:var(--grad-a)} .grad-b{stop-color:var(--grad-b)}
  .dial-needle{transform-origin:50% 50%;transition:transform 1s linear}
  .dial-needle line{stroke:var(--accent)}
  .dial-needle circle{fill:var(--accent)}
  .dial-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .dial-time{font-family:var(--font-head);font-size:38px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1}
  .dial-label{font-size:12px;font-weight:500;color:var(--text-soft);margin-top:var(--s2);text-transform:uppercase;letter-spacing:.06em;min-height:16px;display:flex;align-items:center;gap:6px}
  .dial-label.is-running{color:var(--accent-text)}
  .dial-label.is-running::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.6s var(--ease) infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}

  /* ================= CHIPY ================= */
  .chips{display:flex;gap:var(--s2);flex-wrap:wrap;justify-content:center;margin-bottom:var(--s3)}
  .chips.left{justify-content:flex-start}
  .chip{font-family:var(--font-body);font-size:13px;font-weight:500;padding:8px 14px;min-height:38px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;transition:border-color var(--dur) var(--ease),background-color var(--dur) var(--ease),color var(--dur) var(--ease),transform var(--dur) var(--ease)}
  .chip:hover:not(:disabled){border-color:var(--accent);color:var(--accent-text)}
  .chip:active:not(:disabled){transform:scale(.97)}
  .chip.active{background:var(--accent-tint);border-color:var(--accent);color:var(--accent-text);font-weight:600}
  .chip.add-new{border-style:dashed;color:var(--text-soft);background:transparent}
  .chip:disabled{opacity:.45;cursor:default}

  .custom-row{display:flex;align-items:center;justify-content:center;gap:var(--s2);margin-bottom:var(--s2);font-size:13px;color:var(--text-soft);flex-wrap:wrap}
  .link-btn{background:none;border:none;font-family:var(--font-body);font-size:13px;font-weight:500;color:var(--accent-text);cursor:pointer;padding:8px 6px;border-radius:8px;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;transition:text-decoration-color var(--dur) var(--ease),background-color var(--dur) var(--ease)}
  .link-btn:hover{text-decoration-color:currentColor}
  .sep{color:var(--border)}

  /* ================= PRZYCISKI ================= */
  .controls{display:flex;gap:var(--s3);justify-content:center;flex-wrap:wrap}
  button.primary,button.ghost{font-family:var(--font-body);font-size:15px;font-weight:600;padding:12px 24px;min-height:46px;border-radius:var(--r-btn);cursor:pointer;border:1px solid transparent;transition:background-color var(--dur) var(--ease),border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),transform var(--dur) var(--ease),color var(--dur) var(--ease)}
  button.primary{background:var(--accent);color:var(--accent-fg);box-shadow:var(--shadow-sm)}
  button.primary:hover:not(:disabled){background:var(--accent-strong);transform:translateY(-1px);box-shadow:var(--shadow-md)}
  button.primary.danger{background:var(--error);color:#FFFFFF}
  button.primary.danger:hover:not(:disabled){background:var(--error);filter:brightness(.94)}
  button.ghost{background:transparent;border-color:var(--border);color:var(--text)}
  button.ghost:hover:not(:disabled){background:var(--elevated);border-color:var(--accent)}
  button:active:not(:disabled){transform:scale(.98)}
  button:disabled{opacity:.5;cursor:default}
  button.is-loading{position:relative;color:transparent!important}
  button.is-loading::after{content:'';position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid var(--accent-fg);border-right-color:transparent;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  :focus{outline:none}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px}

  /* ================= NOTATKA PO SESJI ================= */
  .note-view{display:none}
  .note-view.visible{display:block;animation:viewIn .24s var(--ease)}
  .timer-view.hidden{display:none}
  .note-badge{width:44px;height:44px;border-radius:50%;margin:0 auto var(--s3);display:flex;align-items:center;justify-content:center;background:var(--accent-tint);color:var(--accent-text)}
  .note-badge svg{width:22px;height:22px}
  .note-prompt{font-family:var(--font-head);font-size:18px;font-weight:600;text-align:center;margin-bottom:var(--s1)}
  .note-sub{text-align:center;font-size:13px;color:var(--text-soft);margin-bottom:var(--s5);font-variant-numeric:tabular-nums}

  /* ================= POLA ================= */
  textarea,input[type=text],input[type=date],input[type=time],input[type=number]{width:100%;font-family:var(--font-body);font-size:15px;padding:10px 12px;min-height:44px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg);color:var(--text);margin-bottom:var(--s3);transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),background-color var(--dur) var(--ease)}
  input[type=date],input[type=time],input[type=number]{font-variant-numeric:tabular-nums}
  input[type=number]{width:72px;margin-bottom:0;text-align:center;padding:8px}
  textarea{min-height:88px;resize:vertical;line-height:1.5}
  textarea:hover,input:hover:not(:disabled){border-color:var(--text-faint)}
  textarea:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint);background:var(--surface)}
  input:disabled{opacity:.55}
  ::placeholder{color:var(--text-faint)}
  .field-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-soft);margin-bottom:6px;display:block}
  .err{color:var(--error);font-size:13px;font-weight:500;margin:-4px 0 var(--s3);min-height:18px}
  .err.ok{color:var(--success)}

  /* ================= DZIENNIK ================= */
  .toolbar{display:flex;gap:var(--s2);margin-bottom:var(--s3);align-items:center}
  .search-wrap{position:relative;flex:1;min-width:0}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-faint);pointer-events:none}
  .toolbar input[type=text]{margin-bottom:0;padding-left:36px}
  .icon-btn{background:transparent;border:1px solid var(--border);border-radius:var(--r-sm);width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-soft);flex-shrink:0;padding:0;transition:border-color var(--dur) var(--ease),color var(--dur) var(--ease),background-color var(--dur) var(--ease)}
  .icon-btn:hover{border-color:var(--accent);color:var(--accent-text)}
  .icon-btn.active{border-color:var(--accent);color:var(--accent-text);background:var(--accent-tint)}
  .icon-btn svg{width:18px;height:18px}
  .icon-btn.plain{border-color:transparent}
  .icon-btn.plain:hover{background:var(--elevated);border-color:transparent}

  .theme-toggle .ic-sun{display:none}
  .theme-toggle[data-mode="dark"] .ic-sun{display:block}
  .theme-toggle[data-mode="dark"] .ic-moon{display:none}

  .filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--s4)}
  .filter-row .chip{padding:6px 12px;min-height:34px;font-size:12px}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin:0 0 var(--s4)}
  .stats:empty{display:none}
  .stat{background:var(--elevated);border-radius:var(--r-btn);padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:2px;min-width:0}
  .stat-label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-soft)}
  .stat-value{font-family:var(--font-head);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text);line-height:1.25}
  .stat-sub{font-size:13px;color:var(--text-soft);font-variant-numeric:tabular-nums}
  .stat-breakdown{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap}
  .stat-pill{font-size:12px;font-weight:500;padding:4px 10px;border-radius:8px;border:1px solid var(--border-soft);color:var(--text-soft);font-variant-numeric:tabular-nums}
  .stat-pill b{color:var(--accent-text);font-weight:600}

  .disclosure{margin-bottom:var(--s3)}
  .actions-row{display:flex;flex-wrap:wrap;align-items:center;gap:0 var(--s1)}
  .panel{display:none;margin-top:var(--s3);padding:var(--s4);border:1px solid var(--border-soft);border-radius:var(--r-btn);background:var(--elevated)}
  .panel.visible{display:block;animation:viewIn .2s var(--ease)}
  .panel textarea,.panel input{background:var(--surface)}
  .row-2{display:flex;gap:var(--s3)}
  .row-2>div{flex:1;min-width:0}

  .log-heading{font-family:var(--font-head);font-size:14px;font-weight:600;color:var(--text-soft);margin:var(--s4) 0 var(--s1);display:flex;align-items:center;gap:var(--s3)}
  .log-heading::after{content:'';flex:1;height:1px;background:var(--border-soft)}

  .entry{padding:var(--s3) 0;border-bottom:1px solid var(--border-soft)}
  .entry:last-child{border-bottom:none}
  .entry-top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s2)}
  .entry-meta{display:flex;align-items:center;gap:var(--s2);font-size:12px;color:var(--text-soft);margin-bottom:var(--s1);flex-wrap:wrap;font-variant-numeric:tabular-nums}
  .entry-tag{color:var(--accent-text);background:var(--accent-tint);font-weight:600;padding:2px 8px;border-radius:6px}
  .entry-note{font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .entry-actions{display:flex;gap:2px;flex-shrink:0;margin-top:-6px}
  .mini-btn{background:none;border:none;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);color:var(--text-faint);padding:0;transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease)}
  .mini-btn:hover{background:var(--elevated);color:var(--text)}
  .mini-btn[data-act="del"]:hover,.mini-btn[data-bact="del"]:hover{color:var(--error)}
  .mini-btn svg{width:16px;height:16px}
  .mini-btn.starred{color:var(--accent)}
  .entry.editing .entry-static{display:none}
  .entry-edit{padding:var(--s4);border:1px solid var(--border-soft);border-radius:var(--r-btn);background:var(--elevated);animation:viewIn .2s var(--ease)}
  .entry-edit textarea,.entry-edit input{background:var(--surface)}

  .empty-log{text-align:center;font-size:14px;color:var(--text-soft);padding:var(--s5) 0;line-height:1.6}
  .empty-icon{width:44px;height:44px;margin:0 auto var(--s3);border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--elevated);color:var(--accent-text)}
  .empty-icon svg{width:20px;height:20px}
  .empty-log.compact{padding:var(--s3) 0}

  /* ================= KALENDARZ ================= */
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s4)}
  .cal-month{font-family:var(--font-head);font-size:18px;font-weight:600;text-align:center}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s1)}
  .cal-dow{font-size:11px;font-weight:600;text-align:center;color:var(--text-faint);padding-bottom:var(--s1);text-transform:uppercase;letter-spacing:.04em}
  .cal-cell{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7px;border-radius:var(--r-sm);cursor:pointer;font-size:13px;font-weight:500;border:1px solid transparent;color:var(--text);background:transparent;font-variant-numeric:tabular-nums;transition:background-color var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease)}
  .cal-cell:hover{border-color:var(--border)}
  .cal-cell.empty{visibility:hidden;cursor:default}
  .cal-cell.has-entries{background:var(--elevated);border-color:var(--border-soft)}
  .cal-cell.today-cell{font-weight:700;color:var(--accent-text);box-shadow:inset 0 0 0 1.5px var(--accent)}
  .cal-cell.selected{border-color:var(--accent);background:var(--accent);color:var(--accent-fg);box-shadow:var(--shadow-sm)}
  .cal-min{font-size:10px;font-weight:600;margin-top:2px;color:var(--accent-text)}
  .cal-cell.selected .cal-min{color:var(--accent-fg)}
  .cal-dots{display:flex;gap:2px;margin-top:4px}
  .cal-dot{width:4px;height:4px;border-radius:50%;background:var(--accent)}
  .cal-cell.selected .cal-dot{background:var(--accent-fg)}
  .day-panel{margin-top:var(--s5);padding-top:var(--s4);border-top:1px solid var(--border-soft)}
  .day-panel .log-heading{margin-top:0}
  .sub-heading{font-family:var(--font-head);font-size:15px;font-weight:600;margin:var(--s5) 0 var(--s3)}

  /* ================= PLAN DNIA ================= */
  .block-item{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) 0;border-bottom:1px solid var(--border-soft);min-height:52px}
  .block-item:last-child{border-bottom:none}
  .block-check{width:24px;height:24px;border:1.5px solid var(--border);border-radius:7px;background:var(--surface);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0;transition:background-color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
  .block-check:hover{border-color:var(--success)}
  .block-check.done{background:var(--success);border-color:var(--success);animation:pop .22s var(--ease)}
  @keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
  .block-check svg{width:13px;height:13px;color:#FFFFFF}
  .block-time{font-size:13px;font-weight:600;color:var(--accent-text);flex-shrink:0;min-width:46px;font-variant-numeric:tabular-nums}
  .block-text{flex:1;font-size:15px;min-width:0;word-break:break-word;transition:color var(--dur) var(--ease)}
  .block-text.done{text-decoration:line-through;color:var(--text-faint)}
  .add-block-form{display:flex;gap:var(--s2);margin-top:var(--s4);align-items:flex-start}
  .add-block-form .t{width:84px;margin-bottom:0;flex-shrink:0}
  .add-block-form .x{flex:1;margin-bottom:0;min-width:0}
  .add-block-form .icon-btn{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
  .add-block-form .icon-btn:hover{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--accent-fg)}
  .block-progress{height:4px;border-radius:4px;background:var(--elevated);overflow:hidden;margin:0 0 var(--s3)}
  .block-progress span{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--grad-a),var(--grad-b));transition:width .35s var(--ease)}
  .block-summary{font-size:12px;color:var(--text-soft);margin-bottom:var(--s2);font-variant-numeric:tabular-nums}

  /* ================= POWIADOMIENIA ================= */
  .toasts{position:fixed;left:0;right:0;bottom:calc(var(--s4) + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:var(--s2);pointer-events:none;z-index:50;padding:0 var(--s4)}
  .toast{display:flex;align-items:center;gap:var(--s2);max-width:420px;padding:10px 16px 10px 12px;border-radius:var(--r-btn);background:var(--surface);border:1px solid var(--border-soft);box-shadow:var(--shadow-md);font-size:14px;font-weight:500;color:var(--text);opacity:0;transform:translateY(8px);transition:opacity .22s var(--ease),transform .22s var(--ease)}
  .toast.show{opacity:1;transform:none}
  .toast-icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#FFFFFF}
  .toast-icon svg{width:12px;height:12px}
  .toast-success .toast-icon{background:var(--success)}
  .toast-error .toast-icon{background:var(--error)}
  .toast-warning .toast-icon{background:var(--warning)}
  .toast-info .toast-icon{background:var(--info)}

  /* ================= OKNO DIALOGOWE ================= */
  .dialog-root{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:var(--s4);background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .2s var(--ease)}
  .dialog-root.open{opacity:1;pointer-events:auto}
  .dialog{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--r-lg);padding:var(--s5);box-shadow:var(--shadow-md);transform:translateY(10px) scale(.98);transition:transform .22s var(--ease)}
  .dialog-root.open .dialog{transform:none}
  .dialog h2{font-family:var(--font-head);font-size:18px;font-weight:700;margin:0 0 var(--s2)}
  .dialog p{margin:0 0 var(--s4);color:var(--text-soft);font-size:15px}
  .dialog input{margin-bottom:var(--s4)}
  .dialog .controls{justify-content:flex-end}
  @media (max-width:480px){
    .dialog-root{align-items:flex-end;padding:0}
    .dialog{max-width:none;border-radius:var(--r-lg) var(--r-lg) 0 0;padding-bottom:calc(var(--s5) + env(safe-area-inset-bottom))}
    .dialog .controls{flex-direction:column-reverse}
    .dialog .controls button{width:100%}
  }
</style>
</head>
<body>
<div class="page">

  <header class="top">
    <span aria-hidden="true"></span>
    <div class="head-text">
      <div class="date-line" id="todayLine">—</div>

  <!-- ===== TIMER ===== -->

    <div class="card">
      <div class="timer-view" id="timerView">
        <div class="dial-wrap"><div class="dial">

            <defs>
              <linearGradient id="dialGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" class="grad-a"></stop>
                <stop offset="1" class="grad-b"></stop>

            </defs>
            <circle class="dial-track" cx="110" cy="110" r="94"></circle>
            <g id="ticks"></g>
            <circle class="dial-progress" id="progressRing" cx="110" cy="110" r="94" stroke-dasharray="590.6" stroke-dashoffset="0"></circle>

          <button class="primary" id="stopBtn" data-testid="stop">Zakończ i zapisz</button>

        <div style="text-align:center;margin-top:var(--s4)">

<script>
(function () {
'use strict';

/* ---------------- storage (Claude gdy dostępne, w przeciwnym razie localStorage telefonu) ---------------- */
const Store = (function () {
  const real = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function') ? window.storage : null;
  const LS_PREFIX = 'dziennik-nauki:';
  let lsWorks = false;
  try {
    if (typeof localStorage !== 'undefined') {
      localStorage.setItem(LS_PREFIX + '__test', '1');
      localStorage.removeItem(LS_PREFIX + '__test');
      lsWorks = true;
    }
  } catch (e) { lsWorks = false; }
  const mem = new Map();

  return {
    mode: real ? 'claude' : (lsWorks ? 'local' : 'memory'),
    async get(key) {
      if (real) { try { const r = await real.get(key, false); return (r && r.value) ? r.value : null; } catch (e) { return null; } }
      if (lsWorks) { try { return localStorage.getItem(LS_PREFIX + key); } catch (e) { return mem.has(key) ? mem.get(key) : null; } }
      return mem.has(key) ? mem.get(key) : null;
    },
    async set(key, val) {
      if (real) { try { await real.set(key, val, false); return true; } catch (e) { return false; } }
      if (lsWorks) { try { localStorage.setItem(LS_PREFIX + key, val); return true; } catch (e) { mem.set(key, val); return false; } }
      mem.set(key, val); return true;
    }
  };
})();
async function loadJSON(key, fb) {
  const raw = await Store.get(key);
  if (raw === null || raw === undefined) return fb;
  try { const v = JSON.parse(raw); return (v === null || v === undefined) ? fb : v; } catch (e) { return fb; }
}
const saveJSON = (key, val) => Store.set(key, JSON.stringify(val));

const DEFAULT_CATEGORIES = ['SQL', 'Python', 'Angielski', 'Inne'];
const DEFAULT_PRESETS = [45, 20, 30];

/* strażnicy typów: chronią przed uszkodzonymi danymi w magazynie */
const asArray = v => Array.isArray(v) ? v : [];
const asPlainObject = v => (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};

const loadSessions = async () => asArray(await loadJSON('sessions', []))
  .filter(s => s && typeof s === 'object' && s.id !== undefined);
const saveSessions = s => saveJSON('sessions', asArray(s));

const loadCategories = async () => {
  const raw = asArray(await loadJSON('categories', DEFAULT_CATEGORIES))
    .filter(c => typeof c === 'string' && c.trim() !== '');
  return raw.length ? raw : DEFAULT_CATEGORIES.slice();
};
const saveCategories = c => saveJSON('categories', asArray(c));

const loadPresets = async () => {
  const raw = asArray(await loadJSON('presets', DEFAULT_PRESETS))
    .map(Number).filter(n => Number.isFinite(n) && n >= 1 && n <= 180);
  return raw.length ? raw : DEFAULT_PRESETS.slice();
};
const savePresets = p => saveJSON('presets', asArray(p));

const loadDayplans = async () => {
  const obj = asPlainObject(await loadJSON('dayplans', {}));
  const clean = {};
  Object.keys(obj).forEach(k => { if (Array.isArray(obj[k])) clean[k] = obj[k].filter(b => b && typeof b === 'object' && b.id !== undefined); });
  return clean;
};
const saveDayplans = d => saveJSON('dayplans', asPlainObject(d));

/* ---------------- narzędzia ---------------- */
const MONTHS_GEN = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const MONTHS_NOM = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
const MONTHS_ABBR = ['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
const DOW = ['Pn','Wt','Śr','Cz','Pt','So','Nd'];
const DAYS_FULL = ['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];

const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const esc = s => { const d = document.createElement('div'); d.textContent = (s === null || s === undefined) ? '' : String(s); return d.innerHTML; };
const $ = id => document.getElementById(id);

/* polska odmiana: 1 sesja, 2 sesje, 5 sesji */
function plural(n, one, few, many) {
  if (n === 1) return one;
  const m10 = n % 10, m100 = n % 100;
  if (m10 >= 2 && m10 <= 4 && !(m100 >= 12 && m100 <= 14)) return few;
  return many;
}

/* ikony liniowe (jeden styl w całej aplikacji) */
const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="6" x2="12" y2="13"/><line x1="12" y1="18" x2="12" y2="18"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="11" x2="12" y2="18"/><line x1="12" y1="6" x2="12" y2="6"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14Z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><line x1="3" y1="9.5" x2="21" y2="9.5"/><line x1="8" y1="2.5" x2="8" y2="6.5"/><line x1="16" y1="2.5" x2="16" y2="6.5"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><polyline points="3.5 6 4.5 7 6 5"/><polyline points="3.5 12 4.5 13 6 11"/><polyline points="3.5 18 4.5 19 6 17"/></svg>'
};
const emptyState = (icon, html, compact) =>
  `<div class="empty-log${compact ? ' compact' : ''}">${compact ? '' : `<div class="empty-icon">${ICON[icon]}</div>`}${html}</div>`;

/* walidacje */
function parseMinutes(raw, max) {
  const s = String(raw === null || raw === undefined ? '' : raw).trim();
  if (s === '') return { ok: false, msg: 'Podaj liczbę minut.' };
  if (!/^\d+$/.test(s)) return { ok: false, msg: 'Minuty to liczba całkowita.' };
  const n = parseInt(s, 10);
  if (n < 1) return { ok: false, msg: 'Minimum to 1 minuta.' };
  if (n > max) return { ok: false, msg: `Maksimum to ${max} minut.` };
  return { ok: true, value: n };
}
function parseClock(raw) {
  const s = String(raw === null || raw === undefined ? '' : raw).trim();
  if (s === '') return { ok: true, value: '' };
  const m = s.match(/^(\d{1,2})[:.](\d{2})$/);
  if (!m) return { ok: false, msg: 'Zły format godziny, wpisz np. 9:00.' };
  const h = parseInt(m[1], 10), mi = parseInt(m[2], 10);
  if (h > 23) return { ok: false, msg: 'Godzina od 0 do 23.' };
  if (mi > 59) return { ok: false, msg: 'Minuty od 0 do 59.' };
  return { ok: true, value: `${h}:${pad(mi)}` };
}
function parseDateStr(raw) {
  const s = String(raw || '').trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return { ok: false, msg: 'Wybierz datę.' };
  const [y, mo, d] = s.split('-').map(Number);
  const dt = new Date(y, mo - 1, d, 12, 0, 0);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return { ok: false, msg: 'Nieprawidłowa data.' };
  return { ok: true, value: dt };
}
function showErr(el, msg) { if (el) { el.textContent = msg || ''; el.classList.remove('ok'); } }
function showOk(el, msg) { if (el) { el.textContent = msg || ''; el.classList.add('ok'); } }

/* ---------------- powiadomienia ---------------- */
function toast(text, kind) {
  kind = kind || 'success';
  const icon = kind === 'success' ? ICON.check : (kind === 'info' ? ICON.info : ICON.alert);
  const el = document.createElement('div');
  el.className = `toast toast-${kind}`;
  el.setAttribute('role', kind === 'error' ? 'alert' : 'status');
  el.innerHTML = `<span class="toast-icon">${icon}</span><span>${esc(text)}</span>`;
  const box = $('toasts');
  while (box.children.length >= 3) box.firstChild.remove();
  box.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 260); }, kind === 'error' || kind === 'warning' ? 4200 : 2600);
}
const saveFeedback = (ok, msg) => ok ? toast(msg, 'success') : toast('Nie udało się zapisać na stałe w tej przeglądarce.', 'error');

/* ---------------- okno dialogowe (zastępuje confirm i prompt) ---------------- */
const Dialog = (function () {
  const root = $('dialogRoot'), titleEl = $('dialogTitle'), msgEl = $('dialogMsg'), input = $('dialogInput'), ok = $('dialogOk'), cancel = $('dialogCancel');
  let resolver = null, lastFocus = null, mode = 'confirm';
  function open(opts) {
    return new Promise(res => {
      resolver = res; mode = opts.mode;
      titleEl.textContent = opts.title || '';
      msgEl.textContent = opts.message || ''; msgEl.hidden = !opts.message;
      input.hidden = mode !== 'prompt'; input.value = opts.value || ''; input.placeholder = opts.placeholder || '';
      ok.textContent = opts.okLabel || 'OK';
      ok.classList.toggle('danger', !!opts.danger);
      cancel.textContent = opts.cancelLabel || 'Anuluj';
      lastFocus = document.activeElement;
      root.classList.add('open'); root.setAttribute('aria-hidden', 'false');
      setTimeout(() => (mode === 'prompt' ? input : ok).focus(), 40);
    });
  }
  function close(val) {
    if (!resolver) return;
    root.classList.remove('open'); root.setAttribute('aria-hidden', 'true');
    const r = resolver; resolver = null;
    if (lastFocus && typeof lastFocus.focus === 'function') { try { lastFocus.focus(); } catch (e) {} }
    r(val);
  }
  ok.addEventListener('click', () => close(mode === 'prompt' ? input.value : true));
  cancel.addEventListener('click', () => close(mode === 'prompt' ? null : false));
  root.addEventListener('click', e => { if (e.target === root) cancel.click(); });
  document.addEventListener('keydown', e => {
    if (!root.classList.contains('open')) return;
    if (e.key === 'Escape') { e.preventDefault(); cancel.click(); }
    else if (e.key === 'Enter' && document.activeElement !== cancel) { e.preventDefault(); ok.click(); }
  });
  return {
    confirm: o => open(Object.assign({}, o, { mode: 'confirm' })),
    prompt: o => open(Object.assign({}, o, { mode: 'prompt' }))
  };
})();

/* ================= TIMER ================= */
/* czas liczony od znacznika końca, więc nie gubi sekund, gdy telefon przyciemni ekran */
const CIRC = 2 * Math.PI * 94;
const BASE_TITLE = 'Dziennik nauki';
const T = { total: 45 * 60, left: 45 * 60, running: false, iv: null, endAt: 0, lastMinutes: 45 };
const tagRef = { value: 'SQL' };

const timeDisplay = $('timeDisplay'), stateLabel = $('stateLabel'), ring = $('progressRing'), needle = $('needle');
const presetsEl = $('presets'), customMin = $('customMin'), timerErr = $('timerErr');
const controlsIdle = $('controlsIdle'), controlsRunning = $('controlsRunning');
const timerView = $('timerView'), noteView = $('noteView'), noteSub = $('noteSub'), noteText = $('noteText');

(function ticks() {
  const g = $('ticks');
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * 2 * Math.PI, r1 = 82, r2 = 90;
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', 110 + r1 * Math.cos(a)); l.setAttribute('y1', 110 + r1 * Math.sin(a));
    l.setAttribute('x2', 110 + r2 * Math.cos(a)); l.setAttribute('y2', 110 + r2 * Math.sin(a));
    l.setAttribute('class', 'dial-tick'); g.appendChild(l);
  }
  ring.setAttribute('stroke-dasharray', CIRC.toFixed(1));
})();

const fmt = s => `${pad(Math.floor(s / 60))}:${pad(Math.floor(s % 60))}`;
function renderTimer() {
  timeDisplay.textContent = fmt(T.left);
  const frac = T.total > 0 ? T.left / T.total : 0;
  ring.setAttribute('stroke-dashoffset', (CIRC * (1 - frac)).toFixed(1));
  needle.style.transform = `rotate(${90 + (1 - frac) * 360}deg)`;
  stateLabel.textContent = T.running ? 'w toku' : (T.left === T.total ? 'gotowe' : 'pauza');
  stateLabel.classList.toggle('is-running', T.running);
  document.title = (T.running || T.left !== T.total) ? `${fmt(T.left)} · ${BASE_TITLE}` : BASE_TITLE;
}
function setDuration(min) { T.total = min * 60; T.left = min * 60; renderTimer(); }

async function renderPresets() {
  const list = await loadPresets();
  presetsEl.innerHTML = list.map(m => {
    const label = m === 45 ? 'Techniczna · 45' : (m === 20 ? 'Angielski · 20' : `${m} min`);
    const on = m * 60 === T.total;
    return `<button type="button" class="chip${on ? ' active' : ''}" data-min="${m}" aria-pressed="${on}">${label}</button>`;
  }).join('');
}
presetsEl.addEventListener('click', e => {
  const chip = e.target.closest('[data-min]');
  if (!chip || chip.disabled) return;
  selectChip(presetsEl, chip);
  const m = parseInt(chip.dataset.min, 10);
  customMin.value = m; showErr(timerErr, ''); setDuration(m);
});
customMin.addEventListener('change', () => {
  const r = parseMinutes(customMin.value, 180);
  if (!r.ok) { showErr(timerErr, r.msg); return; }
  showErr(timerErr, '');
  presetsEl.querySelectorAll('.chip').forEach(c => { c.classList.remove('active'); c.setAttribute('aria-pressed', 'false'); });
  setDuration(r.value);
});
$('savePresetBtn').addEventListener('click', async () => {
  const r = parseMinutes(customMin.value, 180);
  if (!r.ok) { showErr(timerErr, r.msg); return; }
  showErr(timerErr, '');

  let ok = true;
  if (!list.includes(r.value)) { list.push(r.value); list.sort((a, b) => a - b); ok = await savePresets(list); }
  setDuration(r.value);
  await renderPresets();
  saveFeedback(ok, `Dodano skrót ${r.value} min`);
});

function startTicking() {
  T.endAt = Date.now() + T.left * 1000;
  clearInterval(T.iv);
  T.iv = setInterval(tick, 250);
}
function tick() {
  if (!T.running) return;
  const left = Math.max(0, Math.ceil((T.endAt - Date.now()) / 1000));
  if (left === T.left) return;
  T.left = left;
  if (T.left <= 0) { finishSession(true); return; }
  renderTimer();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

$('startBtn').addEventListener('click', () => {
  const r = parseMinutes(customMin.value, 180);
  if (!r.ok) { showErr(timerErr, r.msg); return; }
  if (T.left === T.total) setDuration(r.value);
  T.running = true;
  controlsIdle.style.display = 'none'; controlsRunning.style.display = 'flex';
  presetsEl.querySelectorAll('.chip').forEach(c => c.disabled = true);
  customMin.disabled = true;
  startTicking(); renderTimer();
});
$('pauseBtn').addEventListener('click', () => {
  if (T.running) {
    T.left = Math.max(0, Math.ceil((T.endAt - Date.now()) / 1000));
    T.running = false; clearInterval(T.iv); $('pauseBtn').textContent = 'Wznów';
  } else {
    T.running = true; $('pauseBtn').textContent = 'Pauza'; startTicking();
  }
  renderTimer();
});
$('stopBtn').addEventListener('click', () => {
  if (T.running) T.left = Math.max(0, Math.ceil((T.endAt - Date.now()) / 1000));
  clearInterval(T.iv); finishSession(false);
});

async function finishSession(natural) {
  clearInterval(T.iv); T.running = false;
  T.lastMinutes = Math.max(1, Math.round((T.total - T.left) / 60));
  noteSub.textContent = `${T.lastMinutes} min`;
  timerView.classList.add('hidden'); noteView.classList.add('visible');
  noteText.value = '';
  document.title = BASE_TITLE;
  if (natural) {
    try { if (navigator.vibrate) navigator.vibrate([180, 90, 180]); } catch (e) {}
    toast('Czas minął, dobra robota', 'info');
  }
  await renderCatChips($('tagRow'), tagRef, true);
}
function resetToIdle() {
  T.running = false; T.left = T.total;
  controlsIdle.style.display = 'flex'; controlsRunning.style.display = 'none';
  $('pauseBtn').textContent = 'Pauza';
  presetsEl.querySelectorAll('.chip').forEach(c => c.disabled = false);
  customMin.disabled = false;
  timerView.classList.remove('hidden'); noteView.classList.remove('visible');
  renderTimer();
}
wireCatChips($('tagRow'), tagRef, true);

  const ok = await saveSessions(list);
  btn.disabled = false; btn.classList.remove('is-loading'); resetToIdle();
  saveFeedback(ok, `Zapisano sesję · ${T.lastMinutes} min`);
});

/* ---------------- kopia zapasowa: eksport / import ---------------- */
const BACKUP_VERSION = 1;
const backupMsg = $('backupMsg');

async function gatherBackup() {
  const [sessions, categories, presets, dayplans] = await Promise.all([
    loadSessions(), loadCategories(), loadPresets(), loadDayplans()
  ]);
  return { app: 'dziennik-nauki', version: BACKUP_VERSION, exportedAt: new Date().toISOString(), sessions, categories, presets, dayplans };
}

function sanitizeBackupPayload(data) {
  if (!data || typeof data !== 'object') throw new Error('To nie jest plik kopii zapasowej.');
  if (!Array.isArray(data.sessions) && data.sessions !== undefined) throw new Error('Uszkodzone dane sesji w pliku.');
  const sessions = asArray(data.sessions).filter(s => s && typeof s === 'object' && s.id !== undefined && s.date && s.subject);
  const categories = asArray(data.categories).filter(c => typeof c === 'string' && c.trim() !== '');
  const presets = asArray(data.presets).map(Number).filter(n => Number.isFinite(n) && n >= 1 && n <= 180);
  const dayplans = asPlainObject(data.dayplans);
  return {
    sessions,
    categories: categories.length ? categories : DEFAULT_CATEGORIES.slice(),
    presets: presets.length ? presets : DEFAULT_PRESETS.slice(),
    dayplans
  };
}

$('exportBtn').addEventListener('click', async () => {
  showErr(backupMsg, '');
  const data = await gatherBackup();
  const json = JSON.stringify(data, null, 2);
  const filename = `dziennik-kopia-${ymd(new Date())}.json`;

  try {
    if (typeof Blob !== 'undefined') {
      const blob = new Blob([json], { type: 'application/json' });
      if (typeof navigator !== 'undefined' && navigator.share && navigator.canShare && typeof File !== 'undefined') {
        const file = new File([blob], filename, { type: 'application/json' });
        if (navigator.canShare({ files: [file] })) {
          try { await navigator.share({ files: [file], title: 'Kopia zapasowa dziennika' }); showOk(backupMsg, 'Wysłano do udostępnienia.'); return; }
          catch (shareErr) { /* anulowane albo niedostępne, spróbuj pobrania */ }
        }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showOk(backupMsg, `Pobrano ${filename}`);
    }
  } catch (e) {
    showErr(backupMsg, 'Nie udało się wyeksportować pliku.');
  }
});

$('importBtn').addEventListener('click', () => {
  showErr(backupMsg, '');
  $('importFile').click();
});

$('importFile').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const go = await Dialog.confirm({
    title: 'Przywrócić dane z kopii?',
    message: 'Obecne wpisy, kategorie, skróty i plany dnia zostaną zastąpione danymi z pliku.',
    okLabel: 'Przywróć'
  });
  if (!go) return;
  try {
    const text = await file.text();
    let parsed;
    try { parsed = JSON.parse(text); } catch (e2) { throw new Error('Plik nie jest poprawnym JSON.'); }
    const clean = sanitizeBackupPayload(parsed);
    await saveSessions(clean.sessions);
    await saveCategories(clean.categories);
    await savePresets(clean.presets);
    await saveDayplans(clean.dayplans);
    const n = clean.sessions.length;
    showOk(backupMsg, `Przywrócono ${n} ${plural(n, 'wpis', 'wpisy', 'wpisów')}.`);
    toast('Dane przywrócone z kopii', 'success');
    await renderPresets();
    await renderLog();
    await renderCalendar();
    await renderSchedule();
  } catch (err) {
    showErr(backupMsg, err.message || 'Nie udało się wczytać pliku.');
  }
});

  if (same(d, t)) return 'dziś';
  if (same(d, y)) return 'wczoraj';
  return `${d.getDate()} ${MONTHS_ABBR[d.getMonth()]}`;

        </button>
      </div>
    </div></div>`;
}
function editHtml(s, cats) {
  return `<div class="entry-edit">
    <span class="field-label">Kategoria</span>
    <div class="chips left edit-tags">${cats.map(c => `<button type="button" class="chip${c === s.subject ? ' active' : ''}" data-ecat="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <span class="field-label">Minuty</span>
    <input type="text" class="edit-minutes" value="${s.minutes}" inputmode="numeric">
    <span class="field-label">Notatka</span>
    <textarea class="edit-note">${esc(s.note)}</textarea>
    <div class="err edit-err"></div>
    <div class="controls">
      <button class="primary" data-act="save-edit" data-id="${s.id}">Zapisz</button>
      <button class="ghost" data-act="cancel-edit" data-id="${s.id}">Anuluj</button>
    </div></div>`;
}

async function renderLog() {
  await renderCatFilter();
  const all = (await loadSessions()).slice().sort((a, b) => new Date(b.date) - new Date(a.date));
  const cats = await loadCategories();

  const totalMin = all.reduce((sum, s) => sum + (Number(s.minutes) || 0), 0);
  const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
  const week = all.filter(s => new Date(s.date).getTime() >= weekAgo);
  const weekMin = week.reduce((sum, s) => sum + (Number(s.minutes) || 0), 0);
  const counts = {};
  week.forEach(s => counts[s.subject] = (counts[s.subject] || 0) + 1);
  const breakdown = Object.entries(counts).sort((a, b) => b[1] - a[1])
    .map(([k, v]) => `<span class="stat-pill"><b>${v}×</b> ${esc(k)}</span>`).join('');
  statsEl.innerHTML = all.length
    ? `<div class="stat">
         <span class="stat-label">Ostatnie 7 dni</span>
         <span class="stat-value">${week.length} <span class="stat-sub">${plural(week.length, 'sesja', 'sesje', 'sesji')}</span></span>
         <span class="stat-sub">${weekMin} min</span>
       </div>
       <div class="stat">
         <span class="stat-label">Łącznie</span>
         <span class="stat-value">${Math.floor(totalMin / 60)}h ${totalMin % 60}m</span>
         <span class="stat-sub">${all.length} ${plural(all.length, 'sesja', 'sesje', 'sesji')}</span>
       </div>
       ${breakdown ? `<div class="stat-breakdown">${breakdown}</div>` : ''}`
    : '';

  const filtered = all.filter(s => {
    if (F.favOnly && !s.favorite) return false;
    if (F.category && s.subject !== F.category) return false;
    if (F.dateFilter && ymd(new Date(s.date)) !== F.dateFilter) return false;
    if (F.search) {
      const hay = ((s.note || '') + ' ' + s.subject).toLowerCase();
      if (!hay.includes(F.search)) return false;
    }
    return true;
  });

  if (!filtered.length) {
    logList.innerHTML = all.length === 0
      ? emptyState('book', 'Jeszcze nic tu nie ma.<br>Pierwsza sesja sama się zapisze.')
      : emptyState('search', 'Nic nie pasuje do filtrów.');
    return;
  }
  logList.innerHTML = filtered.map(s => {
    const editing = editingId === s.id;
    return `<div class="entry${editing ? ' editing' : ''}" data-id="${s.id}">${entryHtml(s)}${editing ? editHtml(s, cats) : ''}</div>`;
  }).join('');
}

logList.addEventListener('click', async e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) {
    const chip = e.target.closest('[data-ecat]');
    if (chip) {
      const row = chip.closest('.edit-tags');
      row.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
    }
    return;
  }
  const id = Number(btn.dataset.id);
  const act = btn.dataset.act;

  if (act === 'fav') {
    const list = await loadSessions();
    const s = list.find(x => x.id === id);
    if (s) { s.favorite = !s.favorite; await saveSessions(list); }
    renderLog(); return;
  }
  if (act === 'del') {
    const go = await Dialog.confirm({ title: 'Usunąć ten wpis?', message: 'Tej operacji nie można cofnąć.', okLabel: 'Usuń', danger: true });
    if (!go) return;
    const list = (await loadSessions()).filter(x => x.id !== id);
    const ok = await saveSessions(list);
    if (editingId === id) editingId = null;
    renderLog(); renderCalendar();
    saveFeedback(ok, 'Wpis usunięty');
    return;
  }
  if (act === 'edit') { editingId = id; renderLog(); return; }
  if (act === 'cancel-edit') { editingId = null; renderLog(); return; }
  if (act === 'save-edit') {
    const wrap = logList.querySelector(`.entry[data-id="${id}"]`);
    const errEl = wrap.querySelector('.edit-err');
    const mr = parseMinutes(wrap.querySelector('.edit-minutes').value, 1440);
    if (!mr.ok) { showErr(errEl, mr.msg); return; }
    const catBtn = wrap.querySelector('.edit-tags .chip.active');
    const list = await loadSessions();
    const s = list.find(x => x.id === id);
    let ok = true;
    if (s) {
      s.minutes = mr.value;
      s.subject = catBtn ? catBtn.dataset.ecat : s.subject;
      s.note = wrap.querySelector('.edit-note').value.trim();
      ok = await saveSessions(list);
    }
    editingId = null; renderLog(); renderCalendar();
    saveFeedback(ok, 'Zmiany zapisane');
    return;
  }
});

/* ================= KALENDARZ ================= */
const CAL = { year: new Date().getFullYear(), month: new Date().getMonth(), selected: null };
const calGrid = $('calGrid'), dayPanel = $('dayPanel');
const quickRef = { value: 'SQL' };

$('calPrev').addEventListener('click', () => { CAL.month--; if (CAL.month < 0) { CAL.month = 11; CAL.year--; } renderCalendar(); });
$('calNext').addEventListener('click', () => { CAL.month++; if (CAL.month > 11) { CAL.month = 0; CAL.year++; } renderCalendar(); });

async function renderCalendar() {
  const sessions = await loadSessions();
  $('calMonthLabel').textContent = `${MONTHS_NOM[CAL.month]} ${CAL.year}`;

  const byDate = {};
  sessions.forEach(s => {
    const k = ymd(new Date(s.date));
    if (!byDate[k]) byDate[k] = { count: 0, minutes: 0 };
    byDate[k].count++; byDate[k].minutes += Number(s.minutes) || 0;
  });

  const first = new Date(CAL.year, CAL.month, 1);
  const offset = (first.getDay() + 6) % 7;
  const days = new Date(CAL.year, CAL.month + 1, 0).getDate();
  const todayKey = ymd(new Date());

  let html = DOW.map(d => `<div class="cal-dow">${d}</div>`).join('');
  for (let i = 0; i < offset; i++) html += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= days; d++) {
    const key = `${CAL.year}-${pad(CAL.month + 1)}-${pad(d)}`;
    const info = byDate[key];
    const cls = ['cal-cell'];
    if (info) cls.push('has-entries');
    if (key === todayKey) cls.push('today-cell');
    if (key === CAL.selected) cls.push('selected');
    const dots = info ? `<div class="cal-dots">${Array.from({ length: Math.min(info.count, 3) }, () => '<div class="cal-dot"></div>').join('')}</div>` : '';
    const mins = info ? `<div class="cal-min">${info.minutes}m</div>` : '';
    html += `<div class="${cls.join(' ')}" data-date="${key}" role="button" tabindex="0" aria-label="${d} ${MONTHS_GEN[CAL.month]}${info ? `, ${info.minutes} min` : ''}"><div>${d}</div>${dots}${mins}</div>`;
  }
  calGrid.innerHTML = html;
  await renderDayPanel();
}

calGrid.addEventListener('click', e => {
  const cell = e.target.closest('[data-date]');
  if (!cell) return;
  CAL.selected = (CAL.selected === cell.dataset.date) ? null : cell.dataset.date;
  renderCalendar();
});
calGrid.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const cell = e.target.closest('[data-date]');
  if (!cell) return;
  e.preventDefault(); cell.click();
});

async function renderDayPanel() {
  if (!CAL.selected) {
    dayPanel.innerHTML = emptyState('calendar', 'Kliknij dzień, żeby zobaczyć wpisy albo dodać nowy.');
    return;
  }
  const sessions = (await loadSessions())
    .filter(s => ymd(new Date(s.date)) === CAL.selected)
    .sort((a, b) => new Date(a.date) - new Date(b.date));
  const [y, m, d] = CAL.selected.split('-').map(Number);
  const label = `${d} ${MONTHS_GEN[m - 1]} ${y}`;
  const total = sessions.reduce((sum, s) => sum + (Number(s.minutes) || 0), 0);

  dayPanel.innerHTML = `
    <div class="log-heading">${esc(label)}${sessions.length ? ` · ${total} min` : ''}</div>
    ${sessions.length
      ? sessions.map(s => `<div class="entry"><div class="entry-meta"><span>${clockOf(s.date)}</span><span class="entry-tag">${esc(s.subject)}</span><span>${s.minutes} min</span></div>${s.note ? `<div class="entry-note">${esc(s.note)}</div>` : ''}</div>`).join('')
      : emptyState('calendar', 'Brak wpisów tego dnia.', true)}
    <div class="panel visible" style="margin-top:var(--s4);animation:none">
      <div class="sub-heading" style="margin-top:0">Dodaj wpis na ten dzień</div>
      <div class="row-2">
        <div><span class="field-label">Godzina</span><input type="time" id="quickTime" data-testid="quick-time" value="09:00"></div>
        <div><span class="field-label">Minuty</span><input type="text" id="quickMinutes" data-testid="quick-minutes" value="45" inputmode="numeric"></div>
      </div>
      <span class="field-label">Kategoria</span>
      <div class="chips left" id="quickTagRow" data-testid="quick-tag-row"></div>
      <span class="field-label">Notatka</span>
      <textarea id="quickNote" data-testid="quick-note" placeholder="Co zrobiłeś?"></textarea>
      <div class="err" id="quickErr" data-testid="quick-err"></div>
      <div class="controls"><button class="primary" id="quickSave" data-testid="quick-save">Dodaj wpis</button></div>
    </div>`;

  await renderCatChips($('quickTagRow'), quickRef, true);
}

dayPanel.addEventListener('click', async e => {
  const addCat = e.target.closest('[data-addcat]');
  if (addCat) {
    const name = await askNewCategory();
    if (!name) return;
    quickRef.value = name;
    await renderCatChips($('quickTagRow'), quickRef, true);
    return;
  }
  const chip = e.target.closest('[data-cat]');
  if (chip) {
    quickRef.value = chip.dataset.cat;
    selectChip($('quickTagRow'), chip);
    return;
  }
  if (e.target.closest('#quickSave')) {
    const mr = parseMinutes($('quickMinutes').value, 1440);
    if (!mr.ok) { showErr($('quickErr'), mr.msg); return; }
    const tr = parseClock($('quickTime').value);
    if (!tr.ok) { showErr($('quickErr'), tr.msg); return; }
    const [y, m, d] = CAL.selected.split('-').map(Number);
    const dt = new Date(y, m - 1, d, 12, 0, 0);
    if (tr.value) { const [h, mi] = tr.value.split(':').map(Number); dt.setHours(h, mi, 0, 0); }
    showErr($('quickErr'), '');
    const list = await loadSessions();
    list.push({ id: Date.now() + Math.floor(Math.random() * 1000), date: dt.toISOString(), subject: quickRef.value, minutes: mr.value, note: $('quickNote').value.trim(), favorite: false });
    const ok = await saveSessions(list);
    renderCalendar();
    saveFeedback(ok, 'Dodano wpis');
  }
});

/* ================= PLAN DNIA ================= */
let schedDate = new Date();
const blockList = $('blockList'), blockErr = $('blockErr');

$('dayPrev').addEventListener('click', () => { schedDate.setDate(schedDate.getDate() - 1); renderSchedule(); });
$('dayNext').addEventListener('click', () => { schedDate.setDate(schedDate.getDate() + 1); renderSchedule(); });

async function renderSchedule() {
  const key = ymd(schedDate);
  $('dayLabel').textContent = (key === ymd(new Date()))
    ? `dziś, ${schedDate.getDate()} ${MONTHS_GEN[schedDate.getMonth()]}`
    : `${DAYS_FULL[schedDate.getDay()]}, ${schedDate.getDate()} ${MONTHS_GEN[schedDate.getMonth()]}`;

  const plans = await loadDayplans();
  const blocks = (plans[key] || []).slice().sort((a, b) => {
    const ta = a.time || '99:99', tb = b.time || '99:99';
    const na = ta.split(':').map(Number), nb = tb.split(':').map(Number);
    return (na[0] * 60 + (na[1] || 0)) - (nb[0] * 60 + (nb[1] || 0));
  });

  if (!blocks.length) {
    blockList.innerHTML = emptyState('list', 'Pusto. Dodaj pierwszy punkt dnia poniżej.');
    return;
  }
  const done = blocks.filter(b => b.done).length;
  const pct = Math.round((done / blocks.length) * 100);
  blockList.innerHTML =
    `<div class="block-summary">zrobione ${done} z ${blocks.length}</div>
     <div class="block-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span style="width:${pct}%"></span></div>` +
    blocks.map(b => `<div class="block-item" data-id="${b.id}">
        <button class="block-check ${b.done ? 'done' : ''}" data-bact="toggle" data-id="${b.id}" aria-label="${b.done ? 'Oznacz jako niezrobione' : 'Oznacz jako zrobione'}" aria-pressed="${!!b.done}">${b.done ? ICON.check : ''}</button>
        <div class="block-time">${esc(b.time || '—')}</div>
        <div class="block-text ${b.done ? 'done' : ''}">${esc(b.text)}</div>
        <button class="mini-btn" data-bact="del" data-id="${b.id}" aria-label="Usuń punkt planu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button></div>`).join('');
}

blockList.addEventListener('click', async e => {
  const btn = e.target.closest('[data-bact]');
  if (!btn) return;
  const id = Number(btn.dataset.id);
  const key = ymd(schedDate);
  const plans = await loadDayplans();
  const arr = plans[key] || [];
  if (btn.dataset.bact === 'toggle') {
    const b = arr.find(x => x.id === id);
    if (b) b.done = !b.done;
  } else if (btn.dataset.bact === 'del') {
    plans[key] = arr.filter(x => x.id !== id);
  }
  if (btn.dataset.bact === 'toggle') plans[key] = arr;
  await saveDayplans(plans);
  renderSchedule();
});

$('blockAddBtn').addEventListener('click', async () => {
  const text = $('blockText').value.trim();
  if (!text) { showErr(blockErr, 'Wpisz, co jest w planie.'); return; }
  const tr = parseClock($('blockTime').value);
  if (!tr.ok) { showErr(blockErr, tr.msg); return; }
  showErr(blockErr, '');
  const key = ymd(schedDate);
  const plans = await loadDayplans();
  if (!Array.isArray(plans[key])) plans[key] = [];
  plans[key].push({ id: Date.now() + Math.floor(Math.random() * 1000), time: tr.value, text, done: false });
  const ok = await saveDayplans(plans);
  if (!ok) toast('Nie udało się zapisać na stałe w tej przeglądarce.', 'error');
  $('blockTime').value = ''; $('blockText').value = '';
  renderSchedule();
  $('blockText').focus();
});
$('blockText').addEventListener('keydown', e => { if (e.key === 'Enter') $('blockAddBtn').click(); });
$('blockTime').addEventListener('keydown', e => { if (e.key === 'Enter') $('blockAddBtn').click(); });

/* ---------------- start ---------------- */
(async function init() {
  await renderPresets();
  renderTimer();
  await renderLog();
  await renderCalendar();
  await renderSchedule();
  if (Store.mode === 'memory') toast('Ta przeglądarka nie pozwala zapisywać danych. Wpisy znikną po zamknięciu.', 'warning');
  window.__appReady = true;
})();

})();
</script>
